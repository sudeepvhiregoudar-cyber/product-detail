<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .result {
            margin-top: 25px;
        }

        .product {
            padding: 12px;
            margin-top: 10px;
            background: #f1f1f1;
            border-radius: 5px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Product Details</h1>

    <label for="productName">Product Name *</label>
    <input type="text" id="productName" placeholder="Enter product name">

    <label for="productPrice">Product Price *</label>
    <input type="number" id="productPrice" placeholder="Enter product price">

    <button onclick="addProduct()">Submit</button>

    <div class="result">
        <h2>Output Result:</h2>

        <h3>Sale Price</h3>
        <div id="productList"></div>

        <h3>Total Price</h3>
        <p id="totalPrice">₹0</p>
    </div>

</div>

<script>
    // Array to store product objects
    const products = [];

    function addProduct() {

        const productName = document.getElementById("productName").value.trim();
        const productPrice = Number(document.getElementById("productPrice").value);

        // Validate input
        if (productName === "" || productPrice <= 0) {
            alert("Please enter a valid product name and product price.");
            return;
        }

        // Create product object
        const product = {
            productName: productName,
            productPrice: productPrice
        };

        // Store object in array
        products.push(product);

        // Display product list
        displayProducts();

        // Clear input fields
        document.getElementById("productName").value = "";
        document.getElementById("productPrice").value = "";
    }

    function displayProducts() {

        const productList = document.getElementById("productList");
        const totalPriceElement = document.getElementById("totalPrice");

        productList.innerHTML = "";

        let total = 0;

        products.forEach(function(product, index) {

            total += product.productPrice;

            const div = document.createElement("div");
            div.className = "product";

            div.innerHTML =
                "<strong>" + (index + 1) + ". " +
                product.productName + "</strong>" +
                " - ₹" + product.productPrice.toFixed(2);

            productList.appendChild(div);
        });

        // Display total product price
        totalPriceElement.textContent = "₹" + total.toFixed(2);
    }
</script>

</body>
</html>
