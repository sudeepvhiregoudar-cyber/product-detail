<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        .product {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            margin: 10px 0;
            background: #f1f1f1;
            border-radius: 6px;
        }

        .price {
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .product {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Product List</h1>

    <div class="product">
        <span>Laptop</span>
        <span class="price">₹55,000</span>
    </div>

    <div class="product">
        <span>Smartphone</span>
        <span class="price">₹25,000</span>
    </div>

    <div class="product">
        <span>Headphones</span>
        <span class="price">₹2,500</span>
    </div>

    <div class="product">
        <span>Keyboard</span>
        <span class="price">₹1,500</span>
    </div>

</div>

</body>
</html>
